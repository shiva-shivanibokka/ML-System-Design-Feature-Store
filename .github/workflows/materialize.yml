name: Materialize

on:
  # Daily, not six-hourly. The offline store is a static file committed to this
  # repo, so every run recomputes byte-identical features and rewrites them to
  # the same keys — four times a day to change nothing. Daily still refreshes
  # the 48h TTL on the entity hashes, which is the only thing that expires.
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:

env:
  # The offline store is the feature_store.duckdb committed to this repo and
  # baked into the container image — the same file the deployed service reads.
  # MotherDuck is gone: its trial ended, which took every DuckDB-backed endpoint
  # down with it. MOTHERDUCK_TOKEN must stay unset, because connections.py picks
  # MotherDuck whenever that variable is non-empty.
  DUCKDB_PATH: feature_store.duckdb
  REDIS_URL: ${{ secrets.REDIS_URL }}

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.api.txt
      - run: python materialization/materialize.py

      # Materialization can report success while the deployed service still
      # sees an empty online store, and nothing downstream would notice:
      # /health checks Valkey with a ping, and a ping is exactly as green
      # against zero keys as against three hundred. Serving would just fall
      # through to the on-demand path for every request — roughly 2.5x the
      # latency, permanently, with a healthy-looking dashboard.
      #
      # So assert population, not reachability, and assert it through the
      # deployed service rather than from this runner: that covers the whole
      # path this job exists to keep working.
      - name: Verify the online store is populated
        run: |
          n=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 10 \
                "${{ secrets.CLOUD_RUN_URL }}/metrics" \
                | python -c "import sys, json; print(json.load(sys.stdin)['online_store_entities'])")
          echo "online_store_entities=$n"
          if [ "$n" -le 0 ]; then
            echo "::error::Online store is empty after materialization — serving is degraded to the on-demand path."
            exit 1
          fi

  health-check:
    runs-on: ubuntu-latest
    steps:
      # Named for what it actually does. A scale-to-zero Cloud Run instance idles
      # out in minutes, so a scheduled ping never kept anything warm; its real
      # value is catching a service that has stopped answering.
      #
      # /health returns 503 only when every component is down, so `-f` fails the
      # job on a total outage but tolerates "degraded" — which is the correct
      # alarm threshold, since the offline store alone can serve every endpoint.
      # --retry rides out a cold start; a persistent failure surfaces (no `|| true`).
      - run: curl -fsS --retry 5 --retry-all-errors --retry-delay 10 "${{ secrets.CLOUD_RUN_URL }}/health"
