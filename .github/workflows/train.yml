name: Train

on:
  workflow_dispatch:

env:
  # Reads the committed offline store, not MotherDuck (trial ended).
  #
  # Note this job's DuckDB writes — the model registry row and the training-time
  # skew baseline — land in the runner's checkout and are thrown away with it.
  # To ship a new baseline, run training locally and commit the updated
  # feature_store.duckdb, which is what the deployed image is built from.
  DUCKDB_PATH: feature_store.duckdb
  REDIS_URL: ${{ secrets.REDIS_URL }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python training/train.py
